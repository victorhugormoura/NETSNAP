name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Um push novo no mesmo ramo cancela a execução anterior.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      # Ações fixadas por commit (a tag pode ser movida); o Dependabot as
      # mantém atualizadas.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          # O token do GITHUB_TOKEN não fica no .git/config enquanto o código
          # da PR roda (os testes do servidor rodam como root).
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Dependências (com conferência de hash)
        run: python -m pip install --require-hashes -r servidor/requirements.lock
      - name: Núcleo compila
        run: python -m py_compile netsnap*.py netdiag.py netcve.py netcontrol.py netalerta.py servidor/*.py
      - name: Sanitização e topologia
        run: |
          python -I testes/test_sanitizar.py
          python -I testes/test_topologia.py
          python -I testes/test_coleta_linux.py
      - name: netcve e análise por IA (APIs simuladas)
        run: |
          python -I testes/test_netcve.py
          python -I testes/test_netsnap_ia.py
          python -I testes/test_netcontrol.py
          python -I testes/test_netalerta.py
      - name: Pacote do servidor
        run: ./servidor/montar.sh --zip
      - name: Servidor (cofre, banco, agenda)
        run: |
          python -I servidor/testes/test_cofre_banco.py
          python -I servidor/testes/test_agenda_retencao.py
      - name: Servidor (API completa com roteador simulado)
        run: |
          # O simulador usa 127.0.1.18:22; o sshd do runner, se houver, ocuparia a porta.
          sudo systemctl stop ssh.socket ssh.service 2>/dev/null || true
          sudo "$(command -v python)" -I servidor/testes/test_servidor.py
